<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Lez Roulette - Direct Shuffle</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        .card {
            background: rgba(40, 25, 0, 0.8);
            padding: 50px;
            border: 4px solid #5c3c10;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        h1 { font-size: 32px; color: #ffaa00; margin-bottom: 5px; text-transform: uppercase; }
        p { color: #d2b48c; margin-bottom: 35px; }

        .spin-btn { 
            padding: 25px 60px; 
            font-size: 26px; 
            font-weight: 900; 
            cursor: pointer; 
            border-radius: 60px; 
            border: none; 
            background: linear-gradient(to bottom, #8b4513, #5c3c10); 
            color: white; 
            transition: 0.2s; 
            text-transform: uppercase;
            box-shadow: 0 10px 0 #3d280a;
        }

        .spin-btn:hover { transform: translateY(2px); box-shadow: 0 8px 0 #3d280a; }
        .spin-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #3d280a; }
    </style>
</head>
<body>

<div class="card">
    <h1>Brown Town Roulette</h1>
    <p>Bypassing Errors. Shuffling Playlist...</p>

    <button class="spin-btn" onclick="launchShuffle()">Spin the Roulette</button>
</div>

<script>
    function launchShuffle() {
        // Your Playlist ID
        const pid = "PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l";
        
        /* 
           Using a randomizer that supports query parameters:
           - pid: The playlist to load
           - autostart: Starts the first random video immediately
        */
        const url = `https://youtube-playlist-randomizer.bitbucket.io/?pid=${pid}&autostart=true`;

        window.open(url, '_blank');
    }
</script>

</body>
</html>
