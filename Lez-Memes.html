<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Lez Roulette - Ad-Free Edition</title>
    <style>
        body { background: #0a0a0a; color: #4CAF50; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        
        #videoTarget { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border: 3px solid #4CAF50; 
            border-radius: 12px; 
            display: none; 
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

        .btn-skitz { 
            background: #4CAF50; color: white; border: none; padding: 20px 40px; 
            font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; 
            transition: 0.2s; box-shadow: 0 5px #224d24;
        }
        .btn-skitz:hover { background: #66bb6a; transform: scale(1.05); }
        .btn-skitz:active { transform: translateY(3px); box-shadow: 0 2px #224d24; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>
        <div id="videoTarget"></div>
        <button class="btn-skitz" onclick="goSkitz()">GET RANDOM MOMENT</button>
    </div>

    <script>
        // Verified list of active Big Lez episodes
        const episodes = [
            "rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "p88_v_8R9Z0", "3_v_tK_v-vU",
            "DOUBOgqghjA", "TikoTD5C0nQ", "1jmd8810c_s", "NTVMEBJVte8", "SUgyIEUFuXw",
            "9NE2DkSBQig", "uExyiKvSf_o", "yS_E3K-pU9k", "oYmpe9u3YI0", "vNq8K6_mB9U"
        ];

        function goSkitz() {
            const target = document.getElementById('videoTarget');
            const randomId = episodes[Math.floor(Math.random() * episodes.length)];
            
            // Random timestamp (between 10s and 120s)
            const randomTime = Math.floor(Math.random() * 110) + 10;

            target.style.display = "block";

            /* 
               ANTI-AD STRATEGY:
               1. youtube-nocookie.com: Prevents tracking ads.
               2. vq=hd720: Forces quality (sometimes skips pre-roll logic).
               3. iv_load_policy=3: Removes popup annotations/links.
               4. modestbranding=1: Removes the YouTube logo.
            */
            const embedUrl = `https://www.youtube-nocookie.com/embed/${randomId}?autoplay=1&start=${randomTime}&rel=0&iv_load_policy=3&modestbranding=1&vq=hd720&showinfo=0`;
            
            target.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }
    </script>
</body>
</html>
