<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unrestricted Playlist Jumper</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
        }
        #container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        #player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        button {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 50px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }
        button:hover {
            background-color: #ff4d4d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #status {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="player-wrapper">
        <iframe id="video-player" src="" allowfullscreen></iframe>
    </div>
    
    <button onclick="getRandomVideo()">Jump to Random Video</button>
    <p id="status">Connecting to playlist...</p>
</div>

<script>
    const playlistId = 'PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-';
    // Using an Invidious instance (yewtu.be) to bypass age restrictions
    const instance = 'https://yewtu.be'; 
    
    // Using AllOrigins Proxy to bypass CORS restrictions on GitHub Pages
    const proxyBase = 'https://api.allorigins.win/get?url=';
    const apiUrl = encodeURIComponent(`${instance}/api/v1/playlists/${playlistId}`);
    
    let videoIds = [];

    async function fetchPlaylist() {
        try {
            const response = await fetch(`${proxyBase}${apiUrl}`);
            if (!response.ok) throw new Error('Proxy error');
            
            const wrapper = await response.json();
            // Data is returned as a string inside wrapper.contents
            const data = JSON.parse(wrapper.contents);
            
            videoIds = data.videos.map(v => v.videoId);
            
            document.getElementById('status').innerText = `Successfully loaded ${videoIds.length} videos.`;
            getRandomVideo(); 
        } catch (error) {
            console.error("Fetch error:", error);
            document.getElementById('status').innerText = "Error loading playlist. The Invidious instance might be down.";
        }
    }

    function getRandomVideo() {
        if (videoIds.length === 0) {
            fetchPlaylist();
            return;
        }

        const randomIndex = Math.floor(Math.random() * videoIds.length);
        const selectedId = videoIds[randomIndex];
        
        const player = document.getElementById('video-player');
        // Pointing the iframe to the embed URL of the bypass instance
        player.src = `${instance}/embed/${selectedId}?autoplay=1`;
        
        document.getElementById('status').innerText = "Shuffled! Enjoy your video.";
    }

    // Auto-load on page start
    fetchPlaylist();
</script>

</body>
</html>
