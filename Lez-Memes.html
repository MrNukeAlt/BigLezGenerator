<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Brute Force Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 95%; 
            max-width: 900px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 25px; 
            padding: 20px 60px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase;
        }
        button:hover { background: #a0522d; transform: scale(1.05); }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; font-weight: bold;}
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" src="" allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">FORCE-LOADING YOUTUBE...</div>

<script>
    // Corrected full Video IDs and their actual durations
    const videoPool = [
        ['vT8p6z_6I68', 5615], // The ~1.5hr video
        ['p7N8_8n-X6k', 3200],
        ['X-HlUu7i-Xo', 2800],
        ['r-f-Wv_zNmb', 4100],
        ['lLBhKZKA9NP', 3600],
        ['ThXy_PL7-0B', 1200]
    ];

    function spin() {
        const frame = document.getElementById('vid-frame');
        const selection = videoPool[Math.floor(Math.random() * videoPool.length)];
        const videoId = selection[0];
        const maxDuration = selection[1];

        // Pick a random time jump
        const randomSeconds = Math.floor(Math.random() * (maxDuration * 0.85)) + 10;

        /* 
           THE FIX:
           We use 'www.youtube.com/embed/' but we add 'force_embed=1' 
           and use the 'v/' fallback logic.
        */
        const finalUrl = `https://www.youtube.com/embed/${videoId}?start=${randomSeconds}&autoplay=1&mute=0&rel=0&modestbranding=1`;

        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = finalUrl;
            
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            document.getElementById('status').innerText = `JUMPED TO ${mins}:${secs < 10 ? '0' : ''}${secs}. IF BLOCKED, TRY NEXT SPIN.`;
        }, 100);
    }

    window.onload = spin;
</script>

</body>
</html>
