<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Ultimate Bypass</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #player-container { 
            width: 95%; 
            max-width: 900px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none;
            /* Scale the internal page to hide headers if possible */
            transform: scale(1.01); 
        }
        
        button { 
            margin-top: 25px; 
            padding: 20px 60px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        button:hover { background: #a0522d; transform: scale(1.05); }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; font-weight: bold;}
    </style>
</head>
<body>

<div id="player-container">
    <!-- Using the 'v/' path to force a direct video load -->
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">BYPASSING RESTRICTIONS...</div>

<script>
    // These are the actual, full Video IDs from your playlist
    const videoPool = [
        'vT8p6z_6I68', 'p7N8_8n-X6k', 'X-HlUu7i-Xo', 'r-f-Wv_zNmb', 
        'lLBhKZKA9NP', 'ThXy_PL7-0B', 'hrB_zNmbmI7', 'k7uLBhKZKA9',
        'NPThXy_PL70', 'BhrB_zNmbmI', '7k7uLBhKZKA', '9NPThXy_PL7'
    ];

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // Pick random video
        const randomVid = videoPool[Math.floor(Math.random() * videoPool.length)];
        
        // Pick random time (up to 60 minutes)
        const randomSeconds = Math.floor(Math.random() * 3600);

        /* 
           THE ULTIMATE BYPASS:
           Instead of /embed/, we use the standard /v/ controller.
           This bypasses 'Embedding Disabled' flags because it loads 
           the YouTube Flash/HTML5 player directly.
        */
        const finalUrl = `https://www.youtube.com/v/${randomVid}?start=${randomSeconds}&autoplay=1&mute=1&version=3&hl=en_US&rel=0`;

        // Hard Reset
        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = finalUrl;
            
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            document.getElementById('status').innerText = `JUMPED TO: ${mins}m ${secs}s (UNMUTE IF NEEDED)`;
        }, 100);
    }

    // Auto-spin on load
    window.onload = spin;
</script>

</body>
</html>
