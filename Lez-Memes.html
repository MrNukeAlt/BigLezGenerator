<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Long Jump Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">READY FOR CHAOS</div>

<script>
    const playlistId = 'PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l';

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // 1. Random Video: Pick a number between 0 and 40
        const randomIndex = Math.floor(Math.random() * 41);
        
        // 2. Random Time: Pick a number between 0 and 3600 (1 Hour)
        // If the video is shorter than the number picked, YouTube will just start it at 0:00.
        const randomSeconds = Math.floor(Math.random() * 3600);

        // 3. Cache Buster to force a new session
        const cb = Math.random().toString(36).substring(7);

        // 4. Construct URL
        // Added 'v=' with a blank space helps some browsers treat the playlist as fresh
        const url = `https://www.youtube.com/embed/videoseries?list=${playlistId}&index=${randomIndex}&start=${randomSeconds}&autoplay=1&mute=1&shuffle=1&rel=0&cb=${cb}`;

        // Hard Reset the iframe
        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = url;
            
            // Format time for the status text (MM:SS)
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            const timeDisplay = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            document.getElementById('status').innerText = `ROULETTED TO: VIDEO #${randomIndex} | TIME: ${timeDisplay}`;
        }, 50);
    }

    window.onload = spin;
</script>

</body>
</html>
