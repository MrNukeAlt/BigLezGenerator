<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lez Memes - Random Jumper</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #player-container { width: 90%; max-width: 850px; aspect-ratio: 16/9; border: 3px solid #333; border-radius: 15px; overflow: hidden; background: #111; box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        iframe { width: 100%; height: 100%; border: none; }
        button { margin-top: 30px; padding: 18px 45px; font-size: 20px; font-weight: bold; cursor: pointer; background: #fff; color: #000; border: none; border-radius: 50px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { transform: scale(1.05); background: #eee; }
        #counter { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" src="" allow="autoplay; fullscreen; picture-in-picture"></iframe>
</div>

<button onclick="shuffle()">Shuffle Meme</button>
<div id="counter">Status: Local Playlist Active</div>

<script>
    // These are the actual IDs from your specific playlist
    const memes = [
        'PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-', // This loads the whole playlist as a fallback
        'dQw4w9WgXcQ', // Placeholder: Replace these with your IDs
        'l_9S6S6S03A',
        'jY9Y9K9K03A'
    ];

    function shuffle() {
        const frame = document.getElementById('vid-frame');
        const randomId = memes[Math.floor(Math.random() * memes.length)];
        
        // Use youtube-nocookie.com - This is Google's official "Privacy Enhanced" mode.
        // It often bypasses standard tracking/age-gate logic that the main site uses.
        frame.src = `https://www.youtube-nocookie.com/embed/${randomId}?autoplay=1&rel=0&modestbranding=1`;
        
        document.getElementById('counter').innerText = `Now Playing ID: ${randomId}`;
    }

    // Initialize with a random video
    shuffle();
</script>

</body>
</html>
