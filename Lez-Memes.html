<!DOCTYPE html>
<html>
<head>
    <title>Random Playlist Jumper</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
        }
        #player-container {
            margin-bottom: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <button onclick="jumpToRandom()">Jump to Random Video</button>

    <script>
        // Load the YouTube IFrame Player API code asynchronously.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        const playlistId = 'PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-';

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '390',
                width: '640',
                playerVars: {
                    'listType': 'playlist',
                    'list': playlistId,
                    'autoplay': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // Shuffle the playlist immediately so the order is randomized
            player.setShuffle(true);
        }

        function jumpToRandom() {
            if (player) {
                // Shuffle again to ensure a new order
                player.setShuffle(true);
                // Move to the next video in the shuffled list
                player.nextVideo();
            }
        }
    </script>
</body>
</html>
