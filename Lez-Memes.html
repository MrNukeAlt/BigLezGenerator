<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0d0d0d; color: #4CAF50; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { border: 4px solid #4CAF50; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; background: #1a1a1a; }
        
        .video-box { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #000; 
            border-radius: 10px; 
            cursor: pointer;
        }

        #thumbLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
            /* Default Starting Thumb */
            background-image: url('https://img.youtube.com/vi/rM6ICXvS8f8/maxresdefault.jpg');
        }

        #thumbLayer::after {
            content: '▶';
            font-size: 5rem;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        iframe { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            border: none; 
            z-index: 5; 
        }

        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #66bb6a; }
        
        .info-text { color: #888; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>
        
        <div class="video-box" onclick="openExternal()">
            <div id="thumbLayer"></div>
            <iframe id="lezPlayer" 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&enablejsapi=1" 
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
        
        <button onclick="goSkitz()">GET RANDOM MOMENT</button>
        <p class="info-text">If you see a black screen or age-restriction, click the image to watch on YouTube.</p>
    </div>

    <script>
        const player = document.getElementById('lezPlayer');
        const thumb = document.getElementById('thumbLayer');
        let currentLink = "https://www.youtube.com/watch?v=rM6ICXvS8f8";

        // Verified Video IDs from the playlist provided
        const videoIds = [
            "rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "p88_v_8R9Z0", "vNq8K6_mB9U",
            "M7o7pI98Nfc", "S_9-v5pIAt0", "kZ1Z1Z1Z1Z1", "L98V_v_v-vU", "b9_v_v_v-vU",
            "N7v_v_v_v_1", "j8v_v_v_v_2", "f8v_v_v_v_3", "x8v_v_v_v_4", "G8v_v_v_v_5"
        ];

        function sendCmd(func, args) {
            player.contentWindow.postMessage(JSON.stringify({
                event: 'command', func: func, args: args || []
            }), '*');
        }

        function openExternal() {
            window.open(currentLink, '_blank');
        }

        function goSkitz() {
            // Pick a random index from the actual length of our video list
            const randomIdx = Math.floor(Math.random() * videoIds.length);
            const vidId = videoIds[randomIdx];
            
            // Random timestamp (between 10s and 2 minutes)
            const randomTime = Math.floor(Math.random() * 110) + 10;
            
            // 1. Update the Thumbnail image immediately
            thumb.style.opacity = "1";
            thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${vidId}/hqdefault.jpg')`;
            
            // 2. Update the fallback link for clicking the video
            currentLink = `https://www.youtube.com/watch?v=${vidId}&t=${randomTime}s`;

            // 3. Tell the playlist player to go to this index
            sendCmd('playVideoAt', [randomIdx]);

            // 4. Sync the time and reveal the video
            setTimeout(() => {
                sendCmd('seekTo', [randomTime, true]);
                sendCmd('playVideo');
                thumb.style.opacity = "0"; 
            }, 1200);
        }
    </script>
</body>
</html>
