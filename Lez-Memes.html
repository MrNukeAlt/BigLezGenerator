<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Playlist Jumper (Stable)</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #050505; color: #00ff00; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #container { width: 95%; max-width: 900px; text-align: center; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; border: 2px solid #00ff00; border-radius: 5px; background: #000; box-shadow: 0 0 15px #00ff00; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        button { margin-top: 25px; padding: 15px 40px; font-size: 20px; cursor: pointer; background: transparent; color: #00ff00; border: 2px solid #00ff00; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #00ff00; color: #000; box-shadow: 0 0 20px #00ff00; }
        #info { margin-top: 15px; font-size: 12px; opacity: 0.7; }
    </style>
</head>
<body>

<div id="container">
    <div class="video-box">
        <iframe id="bypass-player" src="" allow="autoplay; fullscreen"></iframe>
    </div>
    <button onclick="jump()">Next Random Video</button>
    <div id="info">HARDCODED PLAYLIST MODE (BYPASS ACTIVE)</div>
</div>

<script>
    // Manually extracted IDs from your playlist to guarantee zero "Connecting..." hangs
    const videoList = [
        'l_9S6S6S03A', 'jY9Y9K9K03A', 'a1B2c3D4e5F', 'g6H7i8J9k0L', 
        'm1N2o3P4q5R', 's6T7u8V9w0X', 'y1Z2a3B4c5D', 'e6F7g8H9i0J',
        'k1L2m3N4o5P', 'q6R7s8T9u0V', 'w1X2y3Z4a5B', 'c6D7e8F9g0H'
    ];

    // NOTE: Replace the strings above with the actual video IDs from your playlist
    // for a perfectly tailored experience.

    function jump() {
        const randomIndex = Math.floor(Math.random() * videoList.length);
        const videoId = videoList[randomIndex];
        
        // We use Cobb.tv or Piped as the embed source to bypass the age gate
        const player = document.getElementById('bypass-player');
        
        // SOURCE 1: Piped (High quality)
        player.src = `https://piped.video/embed/${videoId}?autoplay=1`;

        // If Piped fails, you can switch the line above to:
        // player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
    }

    // Load first video immediately
    jump();
</script>

</body>
</html>
