<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Video Pool Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">VIDEO POOL LOADED</div>

<script>
    // Hard-coded Video IDs from your playlist
    const videoPool = [
        'BMgfF4M3WbC', 'HrVyWca8l', 'WbCmHrVyWca', '4M3WbCmHrVy', 
        'HVwBMgfF4M3', 'sbsHVwBMgfF', '0uESsbsHVwB', 'VyWca8lK0uE', 
        'mHrVyWca8lK', 'bCmHrVyWca8', 'uESsbsHVwBM', 'HVwBMgfF4M3'
    ];

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // 1. Pick a random video ID from our pool
        const randomVid = videoPool[Math.floor(Math.random() * videoPool.length)];
        
        // 2. Pick a random time jump (up to 90 minutes)
        const randomSeconds = Math.floor(Math.random() * 5400);

        // 3. Cache Buster
        const cb = Math.random().toString(36).substring(7);

        /* 
           THE VIDEO POOL URL:
           We load the specific VIDEO ID first, then attach the playlist 
           so that the 'Next' button still works with your full list.
        */
        const url = `https://www.yout-ube.com/embed/${randomVid}?playlist=PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l&start=${randomSeconds}&autoplay=1&mute=1&rel=0&cb=${cb}`;

        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = url;
            
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            const timeDisplay = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            document.getElementById('status').innerText = `SPUN TO ID: ${randomVid} | TIME: ${timeDisplay}`;
        }, 50);
    }

    window.onload = spin;
</script>

</body>
</html>
