<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Randomizer Fix</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">PRESS BUTTON TO RANDOMIZE</div>

<script>
    const playlistId = 'PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l';

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // 1. Generate a truly random index
        // We use a high number to ensure it picks deep into the playlist
        const randomIndex = Math.floor(Math.random() * 25);
        
        // 2. Generate a random start time (between 10 and 120 seconds)
        // Starting at 10 prevents hitting the intro every time
        const randomSeconds = Math.floor(Math.random() * 110) + 10;

        // 3. Generate a "Cache Buster"
        // This forces the iframe to treat every click as a brand new request
        const cb = Math.random().toString(36).substring(7);

        /* 
           THE ULTIMATE FIX:
           We combine 'videoseries' with 'shuffle=1' AND 'index'.
           The 'index' parameter MUST be paired with 'autoplay=1' to jump properly.
        */
        const url = `https://www.youtube.com/embed/videoseries?list=${playlistId}&index=${randomIndex}&start=${randomSeconds}&autoplay=1&shuffle=1&mute=1&rel=0&cb=${cb}`;

        // Reset the src completely to force a hard reload of the player
        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = url;
            document.getElementById('status').innerText = `ROULEETED TO: VIDEO #${randomIndex} | TIME: ${randomSeconds}s`;
        }, 50);
    }

    // Initial load
    window.onload = spin;
</script>

</body>
</html>
