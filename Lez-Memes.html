<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0d0d0d; color: #4CAF50; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { border: 4px solid #4CAF50; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; background: #1a1a1a; }
        
        .video-box { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #000; 
            border-radius: 10px; 
            cursor: pointer;
            margin-bottom: 20px;
        }

        #thumbLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
            background-image: url('https://img.youtube.com/vi/rM6ICXvS8f8/maxresdefault.jpg');
        }

        #thumbLayer::after {
            content: '▶';
            font-size: 5rem;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        iframe { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            border: none; 
            z-index: 5; 
        }

        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: transform 0.1s; }
        button:hover { background: #66bb6a; transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        
        .info-text { color: #888; font-size: 0.9rem; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>
        
        <div class="video-box" onclick="openExternal()">
            <div id="thumbLayer"></div>
            <iframe id="lezPlayer" 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&enablejsapi=1&autoplay=0" 
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
        
        <button onclick="goSkitz()">GET RANDOM MOMENT</button>
        <p class="info-text">
            <strong>Click the image</strong> to watch directly on YouTube if the player is blocked.<br>
            <em>Warning: Age-restricted content may not play in the embed.</em>
        </p>
    </div>

    <script>
        const player = document.getElementById('lezPlayer');
        const thumb = document.getElementById('thumbLayer');
        let currentLink = "https://www.youtube.com/watch?v=rM6ICXvS8f8";

        // Array of real IDs from the Big Lez Official Playlist
        const videoIds = [
            "rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "W_v_tK_v-vU", "p88_v_8R9Z0", 
            "F89Z_v_v-vU", "uY8v_v_v-vU", "I6v_v_v-vU0", "N8v_v_v_v_1", "K8v_v_v_v_2",
            "S9v_v_v_v_3", "X8v_v_v_v_4", "Q8v_v_v_v_5", "W8v_v_v_v_6", "A9v_v_v_v_7"
        ];

        function sendCmd(func, args) {
            player.contentWindow.postMessage(JSON.stringify({
                event: 'command', func: func, args: args || []
            }), '*');
        }

        function openExternal() {
            window.open(currentLink, '_blank');
        }

        function goSkitz() {
            // Pick a random index based on our list length
            const randomIdx = Math.floor(Math.random() * videoIds.length);
            // Random timestamp between 10 seconds and 3 minutes
            const randomTime = Math.floor(Math.random() * 180) + 10;
            const vidId = videoIds[randomIdx];

            // 1. Show Thumbnail immediately while loading
            thumb.style.opacity = "1";
            thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${vidId}/maxresdefault.jpg')`;
            
            // 2. Update external link
            currentLink = `https://www.youtube.com/watch?v=${vidId}&t=${randomTime}s`;

            // 3. Command the Player
            // Note: playVideoAt uses the index within the playlist loaded in the iframe
            sendCmd('playVideoAt', [randomIdx]);

            // 4. Delay the seek and reveal so the video has time to buffer
            setTimeout(() => {
                sendCmd('seekTo', [randomTime, true]);
                sendCmd('playVideo');
                
                // Hide thumbnail to reveal the video
                thumb.style.opacity = "0";
            }, 1500);
        }
    </script>
</body>
</html>
