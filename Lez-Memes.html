<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0d0d0d; color: #4CAF50; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { border: 4px solid #4CAF50; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; background: #1a1a1a; }
        
        .video-box { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #000; 
            border-radius: 10px; 
            border: 2px solid #333;
        }

        /* The thumbnail layer */
        #thumbLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://img.youtube.com/vi/rM6ICXvS8f8/hqdefault.jpg');
            background-size: cover;
            background-position: center;
            z-index: 5; /* Starts on top */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The video layer (hidden until we know it's ready) */
        iframe { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            border: none; 
            z-index: 1; 
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px #2e6631; }
        button:active { transform: translateY(2px); box-shadow: 0 2px #2e6631; }
        
        .yt-link { display: block; margin-top: 15px; color: #f1c40f; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .status-msg { color: #888; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>
        
        <div class="video-box">
            <!-- Thumbnail sits on top -->
            <div id="thumbLayer"></div>
            
            <!-- Video sits underneath -->
            <iframe id="lezPlayer" 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&enablejsapi=1&autoplay=0" 
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
        
        <button onclick="goSkitz()">GET RANDOM MOMENT</button>
        <p class="status-msg" id="status">Ready to go skitz?</p>
        
        <a id="extLink" class="yt-link" href="#" target="_blank" style="display:none;">
            Age Restricted? Watch this moment on YouTube
        </a>
    </div>

    <script>
        const player = document.getElementById('lezPlayer');
        const thumb = document.getElementById('thumbLayer');
        const status = document.getElementById('status');
        const extLink = document.getElementById('extLink');

        // Note: You can add more IDs here to match the playlist order
        const videoIds = ["rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "p88_v_8R9Z0"];

        function sendCmd(func, args) {
            player.contentWindow.postMessage(JSON.stringify({
                event: 'command', func: func, args: args || []
            }), '*');
        }

        function goSkitz() {
            const randomIdx = Math.floor(Math.random() * 60);
            const randomTime = Math.floor(Math.random() * 270) + 30;
            
            // 1. Instantly hide the old video and show the new thumbnail
            player.style.opacity = "0";
            player.style.zIndex = "1";
            
            const vidId = videoIds[randomIdx] || "rM6ICXvS8f8"; 
            thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${vidId}/hqdefault.jpg')`;
            status.innerText = "Loading the skitzness...";

            // 2. Command the player to change videos
            sendCmd('playVideoAt', [randomIdx]);
            
            // 3. Update the emergency link
            extLink.style.display = "block";
            extLink.href = `https://www.youtube.com/watch?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&index=${randomIdx + 1}&t=${randomTime}s`;

            // 4. The Reveal
            // We wait 2 seconds. If the video is restricted, it stays black, 
            // but the thumbnail will be visible behind it if we keep the player transparent.
            setTimeout(() => {
                sendCmd('seekTo', [randomTime, true]);
                sendCmd('playVideo');
                
                // Show the player
                player.style.opacity = "1";
                player.style.zIndex = "10";
                status.innerText = "Enjoy, ya druggo.";
            }, 2000);
        }
    </script>
</body>
</html>
