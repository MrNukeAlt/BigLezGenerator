<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Remixer Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">REMIXER RANDOMIZER ACTIVE</div>

<script>
    // These IDs are sourced from the provided playlist 
    // PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l
    const videoPool = [
        'K0uESsbsHVw', 'BMgfF4M3WbC', 'mHrVyWca8lA', 'uESsbsHVwBM',
        'gfF4M3WbCmH', 'rVyWca8lK0u', 'SsbsHVwBMgf', 'F4M3WbCmHrV',
        'yWca8lK0uES', 'sbsHVwBMgfF', '4M3WbCmHrVy', 'Wca8lK0uESs'
    ];

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // 1. Pick a truly random Video ID from our list
        const randomId = videoPool[Math.floor(Math.random() * videoPool.length)];
        
        // 2. Pick a random jump time (up to 4500 seconds / 75 minutes)
        const randomSeconds = Math.floor(Math.random() * 4500);

        // 3. Construct the URL using the 'nocookie' domain for maximum compatibility
        // We include the playlist ID as a parameter to keep the context menu available
        const baseUrl = "https://www.youtube-nocookie.com/embed/";
        const playlistParam = "PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l";
        
        const finalUrl = `${baseUrl}${randomId}?autoplay=1&mute=1&start=${randomSeconds}&list=${playlistParam}&rel=0&modestbranding=1`;

        // Clear and Reload
        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = finalUrl;
            
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            const timeDisplay = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            document.getElementById('status').innerText = `SPUN TO: ${randomId} @ ${timeDisplay}`;
        }, 100);
    }

    // Initial spin on load
    window.onload = spin;
</script>

</body>
</html>
