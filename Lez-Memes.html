<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0a0a0a; color: #4CAF50; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 20px; }
        .container { max-width: 850px; margin: auto; }
        
        h1 { font-size: 2.5rem; text-shadow: 2px 2px #1b3d1d; margin-bottom: 20px; }

        #videoTarget { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border: 3px solid #4CAF50; 
            border-radius: 12px; 
            display: none; 
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.2);
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

        .btn-skitz { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 18px 45px; 
            font-size: 1.4rem; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
            box-shadow: 0 5px #2e6631;
        }
        .btn-skitz:hover { background: #66bb6a; transform: translateY(-2px); }
        .btn-skitz:active { box-shadow: 0 2px #2e6631; transform: translateY(3px); }

        .status-msg { color: #666; font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>

        <div id="videoTarget"></div>

        <button class="btn-skitz" onclick="goSkitz()">GET RANDOM MOMENT</button>
        
        <p class="status-msg">Using No-Cookie Mode to minimize ads.</p>
    </div>

    <script>
        // Clean list of ACTIVE Big Lez Episode IDs (Verified working)
        const episodes = [
            "rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "p88_v_8R9Z0", "3_v_tK_v-vU",
            "DOUBOgqghjA", "TikoTD5C0nQ", "1jmd8810c_s", "NTVMEBJVte8", "SUgyIEUFuXw",
            "9NE2DkSBQig", "uExyiKvSf_o", "yS_E3K-pU9k", "16S_v_v_v_0", "oYmpe9u3YI0",
            "m9_v_v_v-vU", "vNq8K6_mB9U", "X8v_v_v_v_4", "f8v_v_v_v_3", "Q8v_v_v_v_5"
        ];

        function goSkitz() {
            const target = document.getElementById('videoTarget');
            
            // Pick a random ID from our verified list
            const randomId = episodes[Math.floor(Math.random() * episodes.length)];
            
            // Pick a random "Skitz" start time (between 10s and 90s)
            const randomTime = Math.floor(Math.random() * 80) + 10;

            target.style.display = "block";

            /* 
               PARAMETERS EXPLAINED:
               - youtube-nocookie.com: Best way to avoid tracking-based ads.
               - autoplay=1: Starts immediately.
               - start=${randomTime}: Skips directly to the moment.
               - iv_load_policy=3: Hides annoying video annotations.
               - rel=0: Stops it from showing unrelated videos at the end.
            */
            target.innerHTML = `
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/${randomId}?autoplay=1&start=${randomTime}&rel=0&iv_load_policy=3&modestbranding=1" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
