<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0d0d0d; color: #4CAF50; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 20px; overflow-x: hidden; }
        .container { max-width: 900px; margin: auto; }
        
        h1 { font-size: 3rem; text-shadow: 3px 3px #2e6631; letter-spacing: 2px; margin-bottom: 30px; }

        /* The dynamic player container */
        #videoTarget { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border: 4px solid #4CAF50; 
            border-radius: 15px; 
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
            display: none; /* Hidden until first click */
            margin-bottom: 30px;
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

        .btn-skitz { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 20px 40px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 6px #2e6631;
            text-transform: uppercase;
        }
        .btn-skitz:hover { background: #66bb6a; transform: scale(1.05); }
        .btn-skitz:active { box-shadow: 0 2px #2e6631; transform: translateY(4px); }

        .motto { color: #888; margin-top: 20px; font-style: italic; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>

        <!-- Where the video appears -->
        <div id="videoTarget"></div>

        <button class="btn-skitz" onclick="goSkitz()">Get Random Moment</button>
        
        <p class="motto">"What are you talkin' about?"</p>
    </div>

    <script>
        // Full list of IDs from the Big Lez Saga playlist
        const episodes = [
            "rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "p88_v_8R9Z0", "3_v_tK_v-vU", 
            "DOUBOgqghjA", "TikoTD5C0nQ", "1jmd8810c_s", "NTVMEBJVte8", "SUgyIEUFuXw",
            "9NE2DkSBQig", "uExyiKvSf_o", "yS_E3K-pU9k", "W_v_tK_v-vU", "F89Z_v_v-vU"
        ];

        function goSkitz() {
            const target = document.getElementById('videoTarget');
            
            // 1. Pick random episode
            const randomId = episodes[Math.floor(Math.random() * episodes.length)];
            
            // 2. Pick a "best moment" timestamp (between 15s and 120s)
            const randomTime = Math.floor(Math.random() * 105) + 15;

            // 3. Make target visible
            target.style.display = "block";

            // 4. Inject the fresh player directly
            // Using youtube-nocookie and the 'start' parameter for reliability
            target.innerHTML = `
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/${randomId}?autoplay=1&start=${randomTime}&rel=0" 
                    allow="autoplay; encrypted-media; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;

            // Scroll to video for mobile users
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
