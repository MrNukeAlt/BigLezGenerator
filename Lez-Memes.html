<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Bypass Edition</title>
    <style>

        button {

            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s;

        button:hover { background: #a0522d; transform: translateY(-2px); }
        #status { margin-top: 15px; font-size: 13px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
            allowfullscreen>

<button onclick="spin()">Brown Town Roulette</button>

<script>

    const videoPool = [

        const frame = document.getElementById('vid-frame');
        
        // Pick random video and random time (up to 1.5 hours)
        const randomVid = videoPool[Math.floor(Math.random() * videoPool.length)];
        const randomSeconds = Math.floor(Math.random() * 5400);

        const baseUrl = "https://www.youtube-nocookie.com/embed/";
        const params = [
            `autoplay=1`,
            `mute=1`,
            `start=${randomSeconds}`,
            `rel=0`,
            `modestbranding=1`,
            `origin=https://youtube.com` // Spoofs the request origin

        const finalUrl = `${baseUrl}${randomVid}?${params}`;

        // Hard reset the iframe
        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = finalUrl;
            
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            document.getElementById('status').innerText = `PLAYING ID: ${randomVid} | JUMPED TO: ${mins}m ${secs}s`;
        }, 100);

    // Load first spin
    window.onload = spin;
