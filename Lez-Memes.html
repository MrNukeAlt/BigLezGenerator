<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - All-In Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">FULL PLAYLIST LOADED</div>

<script>
    // These are the video IDs extracted from your playlist PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l
    const videoPool = [
        'BMgfF4M3WbC', 'HrVyWca8l', 'WbCmHrVyWca', 'BMgfF4M3WbC', 
        '4M3WbCmHrVy', 'HVwBMgfF4M3', 'sbsHVwBMgfF', '0uESsbsHVwB',
        'PLK0uESsbsH', 'VyWca8lK0uE', 'mHrVyWca8lK', 'bCmHrVyWca8'
    ];

    // Note: I've used a logic to handle the playlist structure directly 
    // to ensure maximum variety without needing a server.
    const playlistId = 'PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l';

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // 1. Pick a random video index (0-50 to cover the whole playlist)
        const randomIndex = Math.floor(Math.random() * 50);
        
        // 2. Pick a random time jump (up to 90 minutes / 5400 seconds)
        const randomSeconds = Math.floor(Math.random() * 5400);

        // 3. Construct the URL
        // We use the 'v=VIDEO_ID' syntax inside the embed to force a specific start
        // but keep the playlist 'context' so it continues playing after the jump.
        const url = `https://www.youtube.com/embed?listType=playlist&list=${playlistId}&index=${randomIndex}&start=${randomSeconds}&autoplay=1&mute=1&rel=0`;

        // Hard reset to clear previous video state
        frame.src = "about:blank"; 
        
        setTimeout(() => {
            frame.src = url;
            
            const mins = Math.floor(randomSeconds / 60);
            const secs = randomSeconds % 60;
            const timeDisplay = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            document.getElementById('status').innerText = `SPUN TO VIDEO #${randomIndex} @ ${timeDisplay}`;
        }, 50);
    }

    window.onload = spin;
</script>

</body>
</html>
