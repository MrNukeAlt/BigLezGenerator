<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Smart Audio Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        #vid-frame { width: 100%; height: 100%; border: none; }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        button { 
            padding: 20px 40px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border: 2px solid #5c3c10;
        }

        #spin-btn { 
            background: #8b4513; 
            color: #fff;
            font-size: 22px;
        }
        #spin-btn:hover { transform: scale(1.08); background: #a0522d; }

        #audio-toggle {
            background: #333;
            color: #bbb;
        }
        #audio-toggle.enabled {
            background: #2ecc71;
            color: #fff;
            border-color: #27ae60;
        }

        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="vid-frame"></div>
</div>

<div class="controls">
    <button id="audio-toggle" onclick="toggleAudioMaster()">Audio: Off</button>
    <button id="spin-btn">Brown Town Roulette</button>
</div>

<div id="status">INITIALIZING AUDIO ENGINE...</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let player;
    let audioMasterEnabled = false;
    const playlistId = 'PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l';
    
    const videoPool = [
        ['K0uESsbsHVw', 5635], ['BMgfF4M3WbC', 3200], ['mHrVyWca8lA', 2800], 
        ['uESsbsHVwBM', 4100], ['gfF4M3WbCmH', 3600], ['rVyWca8lK0u', 1200], 
        ['SsbsHVwBMgf', 5400], ['F4M3WbCmHrV', 900],  ['yWca8lK0uES', 3300],
        ['sbsHVwBMgfF', 4800], ['4M3WbCmHrVy', 2500], ['Wca8lK0uESs', 5600]
    ];

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('vid-frame', {
            height: '100%',
            width: '100%',
            playerVars: {
                'autoplay': 1,
                'controls': 1,
                'modestbranding': 1,
                'rel': 0,
                'enablejsapi': 1,
                'origin': window.location.origin
            },
            events: {
                'onReady': () => {
                    document.getElementById('status').innerText = "SYSTEM READY - CONFIGURE AUDIO";
                }
            }
        });
    }

    function toggleAudioMaster() {
        const btn = document.getElementById('audio-toggle');
        audioMasterEnabled = !audioMasterEnabled;
        
        if (audioMasterEnabled) {
            btn.innerText = "Audio: On (50%)";
            btn.classList.add('enabled');
            player.unMute();
            player.setVolume(50);
        } else {
            btn.innerText = "Audio: Off";
            btn.classList.remove('enabled');
            player.mute();
        }
    }

    document.getElementById('spin-btn').addEventListener('click', function() {
        if (!player) return;

        const selection = videoPool[Math.floor(Math.random() * videoPool.length)];
        const videoId = selection[0];
        const maxDuration = selection[1];
        const randomSeconds = Math.floor(Math.random() * (maxDuration * 0.9)) + 10;

        player.loadVideoById({
            videoId: videoId,
            startSeconds: randomSeconds
        });

        // Ensure audio settings persist after the new video loads
        if (audioMasterEnabled) {
            player.unMute();
            player.setVolume(50);
        } else {
            player.mute();
        }

        const mins = Math.floor(randomSeconds / 60);
        const secs = randomSeconds % 60;
        const audioStatus = audioMasterEnabled ? "UNMUTED (50%)" : "MUTED";
        document.getElementById('status').innerText = `SPUN! ${audioStatus} | JUMPED TO ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    });
</script>

</body>
</html>
