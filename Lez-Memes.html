<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Final Fix</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="status">LOCAL MODE ACTIVE</div>

<script>
    const playlistId = 'PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l';

    function spin() {
        const frame = document.getElementById('vid-frame');
        
        // 1. Generate a random video index (0 to 15)
        const randomIndex = Math.floor(Math.random() * 15);
        
        // 2. Generate a random start time (0 to 60 seconds)
        // Since we can't get the exact duration without the API, 
        // we pick a safe range to ensure we don't skip the whole video.
        const randomSeconds = Math.floor(Math.random() * 60);

        /* 
           THE URL ATTACK:
           We use the 'videoseries' endpoint which is more stable for local files.
           - index: picks the video
           - start: jumps to the second
           - autoplay: starts it
        */
        const url = `https://www.youtube.com/embed/videoseries?list=${playlistId}&index=${randomIndex}&start=${randomSeconds}&autoplay=1&rel=0&modestbranding=1&mute=1`;

        frame.src = url;
        document.getElementById('status').innerText = `JUMPED TO VIDEO #${randomIndex} @ ${randomSeconds}s (UNMUTE MANUALLY)`;
    }

    // Load first spin on page load
    window.onload = spin;
</script>

</body>
</html>
