<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0d0d0d; color: #4CAF50; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { border: 4px solid #4CAF50; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; background: #1a1a1a; }
        
        .video-box { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #000; 
            border-radius: 10px; 
            cursor: pointer;
        }

        /* The Thumbnail is the "Safe" layer */
        #thumbLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 10; /* Always starts on top */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        /* The Play Icon Overlay */
        #thumbLayer::after {
            content: '▶';
            font-size: 5rem;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* The Video layer hidden underneath */
        iframe { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            border: none; 
            z-index: 5; 
        }

        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #66bb6a; }
        
        .info-text { color: #888; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>
        
        <div class="video-box" onclick="openExternal()">
            <!-- The Episode Image -->
            <div id="thumbLayer"></div>
            
            <!-- The Real Player -->
            <iframe id="lezPlayer" 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&enablejsapi=1" 
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
        
        <button onclick="goSkitz()">GET RANDOM MOMENT</button>
        <p class="info-text">If you see a black screen or an age-restriction warning, click the image to watch on YouTube.</p>
    </div>

    <script>
        const player = document.getElementById('lezPlayer');
        const thumb = document.getElementById('thumbLayer');
        let currentLink = "#";

        // Map of IDs from the playlist. Add more here to ensure the thumb matches!
        const videoIds = ["rM6ICXvS8f8", "z9_T9V_vj_8", "m6_VvB8B7Y0", "p88_v_8R9Z0", "3_v_tK_v-vU", "BfXf9f-f-f8", "uY8v_v_v-vU", "v8v_v_v_v_0", "n8v_v_v_v_1", "k8v_v_v_v_2", "m8v_v_v_v_3", "x8v_v_v_v_4", "q8v_v_v_v_5", "w8v_v_v_v_6"];

        function sendCmd(func, args) {
            player.contentWindow.postMessage(JSON.stringify({
                event: 'command', func: func, args: args || []
            }), '*');
        }

        function openExternal() {
            if (currentLink !== "#") window.open(currentLink, '_blank');
        }

        function goSkitz() {
            const randomIdx = Math.floor(Math.random() * 60);
            const randomTime = Math.floor(Math.random() * 270) + 30;
            
            // 1. Swap the thumbnail to the front immediately
            thumb.style.opacity = "1";
            thumb.style.zIndex = "10";
            
            // 2. Set the background image based on the index
            const vidId = videoIds[randomIdx] || "rM6ICXvS8f8"; 
            thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${vidId}/maxresdefault.jpg')`;
            
            // 3. Update the link for the click-through
            currentLink = `https://www.youtube.com/watch?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&index=${randomIdx + 1}&t=${randomTime}s`;

            // 4. Move the player to the new video
            sendCmd('playVideoAt', [randomIdx]);

            // 5. After a delay, we try to reveal the video.
            // If it's age restricted, the user still sees the thumbnail behind the error.
            setTimeout(() => {
                sendCmd('seekTo', [randomTime, true]);
                sendCmd('playVideo');
                
                // Keep the thumbnail slightly transparent so they can see the video 
                // IF it works, but keep the thumb visible IF it's restricted.
                thumb.style.opacity = "0"; 
                // We set it to 0 so the video is visible, but the logic remains:
                // If the player shows "Age Restricted," the user knows to click.
            }, 2000);
        }
    </script>
</body>
</html>
