<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Debug Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        #vid-frame { width: 100%; height: 100%; border: none; }
        
        .controls { margin-top: 25px; display: flex; gap: 15px; }

        button { 
            padding: 15px 30px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase; 
            border: 2px solid #5c3c10;
        }

        #spin-btn { background: #8b4513; color: #fff; }
        #spin-btn:hover { background: #a0522d; transform: scale(1.05); }

        #audio-btn { background: #333; color: #fff; }
        #audio-btn.active { background: #2ecc71; border-color: #27ae60; }

        /* Debug Screen Styles */
        #debug-console {
            margin-top: 20px;
            width: 90%;
            max-width: 850px;
            background: #000;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #0f0; /* Terminal Green */
            overflow-y: auto;
            max-height: 150px;
        }
        .error-msg { color: #ff4444; font-weight: bold; }
        .info-msg { color: #aaa; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="vid-frame"></div>
</div>

<div class="controls">
    <button id="audio-btn" onclick="toggleAudio()">Audio: OFF</button>
    <button id="spin-btn" onclick="spin()">Brown Town Roulette</button>
</div>

<div id="debug-console">
    <div>[DEBUG] System Initializing...</div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let player;
    let audioEnabled = false;
    const debug = document.getElementById('debug-console');

    const videoPool = [
        ['vT8p6z_6I68', 5635], ['p7N8_8n-X6k', 3200], ['X-HlUu7i-Xo', 2800], 
        ['r-f-Wv_zNmb', 4100], ['lLBhKZKA9NP', 3600], ['ThXy_PL7-0B', 1200], 
        ['SsbsHVwBMgf', 5400], ['F4M3WbCmHrV', 900],  ['yWca8lK0uES', 3300],
        ['sbsHVwBMgfF', 4800], ['4M3WbCmHrVy', 2500], ['Wca8lK0uESs', 5600]
    ];

    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = type === 'error' ? 'error-msg' : 'info-msg';
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        debug.prepend(div);
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('vid-frame', {
            height: '100%',
            width: '100%',
            playerVars: {
                'autoplay': 1,
                'controls': 1,
                'rel': 0,
                'enablejsapi': 1,
                'origin': window.location.origin
            },
            events: {
                'onReady': () => log("Player Ready."),
                'onError': onPlayerError
            }
        });
    }

    function onPlayerError(event) {
        const errors = {
            2: "Invalid Parameter (Video ID is wrong)",
            5: "HTML5 Player Error (Browser issue)",
            100: "Video Deleted or Marked Private",
            101: "EMBEDDING BLOCKED: Owner disabled playback on external sites",
            150: "EMBEDDING BLOCKED: Likely a music video or copyright restriction"
        };
        const errorMsg = errors[event.data] || `Unknown Error (Code: ${event.data})`;
        log(`CRITICAL: ${errorMsg}`, 'error');
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        const btn = document.getElementById('audio-btn');
        if (audioEnabled) {
            btn.innerText = "Audio: ON (50%)";
            btn.classList.add('active');
            player.unMute();
            player.setVolume(50);
            log("Audio Enabled - Volume 50%");
        } else {
            btn.innerText = "Audio: OFF";
            btn.classList.remove('active');
            player.mute();
            log("Audio Muted");
        }
    }

    function spin() {
        if (!player) return;
        const selection = videoPool[Math.floor(Math.random() * videoPool.length)];
        const videoId = selection[0];
        const maxDuration = selection[1];
        const jump = Math.floor(Math.random() * (maxDuration * 0.9)) + 10;

        log(`Spinning to ${videoId} at ${jump}s...`);

        player.loadVideoById({
            videoId: videoId,
            startSeconds: jump
        });

        if (audioEnabled) {
            player.unMute();
            player.setVolume(50);
        }
    }
</script>

</body>
</html>
