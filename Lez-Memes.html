<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Big Lez Roulette - Skitz Edition</title>
    <style>
        body { background: #0d0d0d; color: #4CAF50; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { border: 4px solid #4CAF50; padding: 20px; border-radius: 15px; max-width: 800px; margin: auto; background: #1a1a1a; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 10px; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #66bb6a; }
        .yt-link { display: block; margin-top: 15px; color: #f1c40f; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .yt-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BROWN TOWN ROULETTE</h1>
        <div class="video-box">
            <iframe id="lezPlayer" 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&enablejsapi=1&autoplay=1" 
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
        
        <button onclick="goSkitz()">GET RANDOM MOMENT</button>
        
        <!-- Fix: Link to open the video on YT if age-restriction blocks the embed -->
        <a id="externalLink" class="yt-link" href="#" target="_blank" style="display:none;">
            Blocked? Click here to watch this moment on YouTube
        </a>
    </div>

    <script>
        const player = document.getElementById('lezPlayer');
        const extLink = document.getElementById('externalLink');

        function sendCmd(func, args) {
            player.contentWindow.postMessage(JSON.stringify({
                event: 'command', func: func, args: args || []
            }), '*');
        }

        function goSkitz() {
            const randomVidIndex = Math.floor(Math.random() * 60);
            const randomTime = Math.floor(Math.random() * 270) + 30;

            // Load and play
            sendCmd('playVideoAt', [randomVidIndex]);
            
            // Show the external link just in case it's age restricted
            // (Wait a bit for the playlist to update)
            setTimeout(() => {
                extLink.style.display = "block";
                // Note: Getting the specific Video ID from a playlist via JS postMessage 
                // is limited for security. This link will take them to the general playlist 
                // if the specific ID can't be fetched locally.
                extLink.href = `https://www.youtube.com/watch?list=PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-&index=${randomVidIndex + 1}&t=${randomTime}s`;
            }, 500);

            setTimeout(() => {
                sendCmd('seekTo', [randomTime, true]);
                sendCmd('playVideo');
            }, 1800);
        }
    </script>
</body>
</html>
