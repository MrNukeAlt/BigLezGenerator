<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette - Audio Master</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        #vid-frame { width: 100%; height: 100%; border: none; }
        
        .controls { margin-top: 25px; display: flex; gap: 15px; align-items: center; }

        button { 
            padding: 15px 35px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s; 
            text-transform: uppercase;
        }

        #spin-btn { background: #8b4513; }
        #spin-btn:hover { background: #a0522d; transform: scale(1.05); }

        #mute-btn { background: #444; min-width: 180px; }
        #mute-btn.active { background: #2ecc71; border-color: #27ae60; }

        #status { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="vid-frame"></div>
</div>

<div class="controls">
    <button id="mute-btn" onclick="toggleAudio()">AUDIO: MUTED</button>
    <button id="spin-btn" onclick="spin()">Brown Town Roulette</button>
</div>

<div id="status">WAITING FOR PLAYER...</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let player;
    let isMuted = true;

    // Full 11-char IDs from your playlist
    const videoPool = [
        ['vT8p6z_6I68', 5615], ['p7N8_8n-X6k', 3200], ['X-HlUu7i-Xo', 2800],
        ['r-f-Wv_zNmb', 4100], ['lLBhKZKA9NP', 3600], ['ThXy_PL7-0B', 1200]
    ];

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('vid-frame', {
            height: '100%',
            width: '100%',
            playerVars: {
                'autoplay': 1,
                'mute': 1, // Start muted to comply with browser rules
                'controls': 1,
                'rel': 0,
                'modestbranding': 1
            },
            events: {
                'onReady': () => { document.getElementById('status').innerText = "SYSTEM READY"; }
            }
        });
    }

    function toggleAudio() {
        const btn = document.getElementById('mute-btn');
        if (isMuted) {
            player.unMute();
            player.setVolume(50);
            btn.innerText = "AUDIO: ENABLED";
            btn.classList.add('active');
            isMuted = false;
        } else {
            player.mute();
            btn.innerText = "AUDIO: MUTED";
            btn.classList.remove('active');
            isMuted = true;
        }
    }

    function spin() {
        if (!player) return;

        const selection = videoPool[Math.floor(Math.random() * videoPool.length)];
        const videoId = selection[0];
        const maxDuration = selection[1];
        const randomSeconds = Math.floor(Math.random() * (maxDuration * 0.85)) + 10;

        // Load the new video while keeping the player instance
        player.loadVideoById({
            videoId: videoId,
            startSeconds: randomSeconds
        });

        // CRITICAL: Immediately re-apply the user's audio preference
        // This prevents the new video from defaulting to muted
        setTimeout(() => {
            if (!isMuted) {
                player.unMute();
                player.setVolume(50);
            } else {
                player.mute();
            }
        }, 150);

        const mins = Math.floor(randomSeconds / 60);
        const secs = randomSeconds % 60;
        document.getElementById('status').innerText = `ROULETTE: ${videoId} @ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
</script>

</body>
</html>
