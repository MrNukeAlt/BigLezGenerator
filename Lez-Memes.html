<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Playlist Jumper</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0f0f0f; color: white; margin: 0; }
        #container { width: 90%; max-width: 800px; text-align: center; }
        #player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; background: #000; overflow: hidden; }
        #player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff0000; color: white; border: none; border-radius: 50px; font-weight: bold; }
        #status { margin-top: 15px; color: #888; font-size: 13px; }
        #debug { font-family: monospace; font-size: 10px; color: #444; margin-top: 5px; }
    </style>
</head>
<body>

<div id="container">
    <div id="player-wrapper">
        <iframe id="video-player" src="" allowfullscreen></iframe>
    </div>
    <button onclick="getRandomVideo()">Shuffle Random Video</button>
    <p id="status">Initializing...</p>
    <div id="debug"></div>
</div>

<script>
    const playlistId = 'PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-';
    
    // List of reliable 2026 instances to try if one is down
    const instances = [
        'https://yewtu.be',
        'https://inv.tux.rs',
        'https://invidious.nerdvpn.de',
        'https://inv.nadeko.net'
    ];
    
    let currentInstanceIndex = 0;
    let videoIds = [];

    function log(msg) {
        document.getElementById('debug').innerText += `> ${msg}\n`;
        console.log(msg);
    }

    async function fetchPlaylist() {
        const instance = instances[currentInstanceIndex];
        const statusEl = document.getElementById('status');
        statusEl.innerText = `Connecting to ${instance.replace('https://','')}...`;
        
        // Using a different proxy as backup (AllOrigins)
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(instance + '/api/v1/playlists/' + playlistId)}&timestamp=${Date.now()}`;

        try {
            log(`Trying instance: ${instance}`);
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Proxy unreachable');
            
            const wrapper = await response.json();
            const data = JSON.parse(wrapper.contents);
            
            if (data && data.videos) {
                videoIds = data.videos.map(v => v.videoId);
                statusEl.innerText = `Ready! Loaded ${videoIds.length} videos.`;
                log(`Success! Found ${videoIds.length} videos.`);
                getRandomVideo();
            } else {
                throw new Error('Invalid data format');
            }
        } catch (err) {
            log(`Failed: ${err.message}`);
            currentInstanceIndex++;
            if (currentInstanceIndex < instances.length) {
                fetchPlaylist(); // Try next instance
            } else {
                statusEl.innerText = "All instances failed. YouTube might be blocking proxies.";
                currentInstanceIndex = 0; // Reset for manual retry
            }
        }
    }

    function getRandomVideo() {
        if (videoIds.length === 0) {
            fetchPlaylist();
            return;
        }

        const selectedId = videoIds[Math.floor(Math.random() * videoIds.length)];
        const player = document.getElementById('video-player');
        
        // Use the current working instance for the embed
        player.src = `${instances[currentInstanceIndex]}/embed/${selectedId}?autoplay=1`;
        document.getElementById('status').innerText = "Playing random selection.";
    }

    fetchPlaylist();
</script>
</body>
</html>
