<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        #vid-frame { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button:hover { transform: scale(1.08); background: #a0522d; }
        #counter { margin-top: 15px; font-size: 14px; color: #8b4513; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="vid-frame"></div>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="counter">INITIALIZING...</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const playlistId = 'PLK0uESsbsHVwBMgfF4M3WbCmHrVyWca8l';
    let player;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('vid-frame', {
            height: '100%',
            width: '100%',
            playerVars: {
                listType: 'playlist',
                list: playlistId,
                autoplay: 1,
                mute: 1, 
                modestbranding: 1,
                rel: 0,
                enablejsapi: 1,
                origin: window.location.origin
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        document.getElementById('counter').innerText = "BROWN TOWN READY - CLICK TO START";
    }

    function onPlayerStateChange(event) {
        // If the video ends, it will naturally go to the next in the playlist
        if (event.data === YT.PlayerState.ENDED) {
            console.log("Video ended, next one coming up.");
        }
    }

    function spin() {
        if (player && typeof player.cuePlaylist === 'function') {
            // Pick a random index (your playlist currently has ~20-30 videos)
            const randomStartIndex = Math.floor(Math.random() * 15);
            
            // CUE first, then PLAY. This is more stable for local files.
            player.cuePlaylist({
                listType: 'playlist',
                list: playlistId,
                index: randomStartIndex
            });

            // Short delay to let the API register the cue before playback
            setTimeout(() => {
                player.playVideo();
                player.unMute();
                player.setVolume(50);
                document.getElementById('counter').innerText = "SPINNING... VOLUME 50%";
            }, 300);

        } else {
            // Emergency reload if API is unresponsive
            location.reload();
        }
    }
</script>

</body>
</html>
