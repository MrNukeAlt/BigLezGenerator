<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brown Town Roulette</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a0f00; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #player-container { 
            width: 90%; 
            max-width: 850px; 
            aspect-ratio: 16/9; 
            border: 3px solid #5c3c10; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        button { 
            margin-top: 30px; 
            padding: 20px 50px; 
            font-size: 22px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #8b4513; 
            color: #fff; 
            border: 2px solid #5c3c10; 
            border-radius: 50px; 
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button:hover { 
            transform: scale(1.08); 
            background: #a0522d; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        button:active { transform: scale(0.95); }

        #counter { 
            margin-top: 15px; 
            font-size: 14px; 
            color: #8b4513; 
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="vid-frame" 
            title="Brown Town Player"
            src="" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen>
    </iframe>
</div>

<button onclick="spin()">Brown Town Roulette</button>
<div id="counter">WELCOME TO BROWN TOWN</div>

<script>
    // Your specific playlist ID
    const playlistId = 'PL7-0BhrB_zNmbmI7k7uLBhKZKA9NPThXy';

    function spin() {
        const frame = document.getElementById('vid-frame');
        if (!frame) return;

        // Bypassing Error 153:
        // 1. Using /embed/videoseries instead of /embed?listType
        // 2. Generating a random index to simulate a 'fresh' user click
        // 3. Muting by default to ensure autoplay isn't blocked by the browser
        const randomStartIndex = Math.floor(Math.random() * 50); 
        
        const params = [
            `list=${playlistId}`,
            `autoplay=1`,
            `index=${randomStartIndex}`,
            `mute=1`, // Prevents the browser from blocking the "auto-spin"
            `modestbranding=1`,
            `rel=0`,
            `enablejsapi=1`
        ].join('&');
        
        // Using standard domain for maximum compatibility with Error 153
        frame.src = `https://www.youtube.com/embed/videoseries?${params}`;
        
        document.getElementById('counter').innerText = "SPINNING THE BLOCK... (UNMUTE PLAYER)";
        
        setTimeout(() => {
            document.getElementById('counter').innerText = "NOW PLAYING FROM BROWN TOWN";
        }, 2000);
    }

    // Initialize the player when the page loads
    window.addEventListener('load', spin);
</script>

</body>
</html>
