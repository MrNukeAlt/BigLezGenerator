<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unrestricted Random Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
        }
        #container {
            width: 80%;
            max-width: 800px;
            text-align: center;
        }
        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
            border-radius: 8px;
            background: #000;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 30px;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover {
            background-color: #00cec9;
            transform: scale(1.05);
        }
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

<div id="container">
    <div id="video-wrapper">
        <!-- The video will load here -->
        <iframe id="video-player" src="" allowfullscreen></iframe>
    </div>
    
    <button onclick="getRandomVideo()">Jump to Random Restricted Video</button>
    <p id="status">Loading playlist data...</p>
</div>

<script>
    const playlistId = 'PLq4agcs7qzw3OGcGiaUaKVGJ1ng5lC-0-';
    const instance = 'https://yewtu.be'; // You can change this to any Invidious instance
    let videoIds = [];

    // 1. Fetch playlist data from Invidious API on load
    async function fetchPlaylist() {
        try {
            const response = await fetch(`${instance}/api/v1/playlists/${playlistId}`);
            const data = await response.json();
            
            // Extract IDs from the video objects
            videoIds = data.videos.map(v => v.videoId);
            
            document.getElementById('status').innerText = `Loaded ${videoIds.length} videos.`;
            getRandomVideo(); // Load first random video
        } catch (error) {
            console.error("Error fetching playlist:", error);
            document.getElementById('status').innerText = "Failed to load playlist. Try refreshing.";
        }
    }

    // 2. Pick a random ID and update the iframe
    function getRandomVideo() {
        if (videoIds.length === 0) return;

        const randomIndex = Math.floor(Math.random() * videoIds.length);
        const selectedId = videoIds[randomIndex];
        
        // Load the video via the Invidious embedded player (bypasses age gates)
        const player = document.getElementById('video-player');
        player.src = `${instance}/embed/${selectedId}?autoplay=1`;
        
        document.getElementById('status').innerText = "Playing a random selection...";
    }

    // Initialize
    fetchPlaylist();
</script>

</body>
</html>
